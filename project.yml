# Xcode projesi xcodegen ile üretilir; .xcodeproj git'e girmez (.gitignore).
#   xcodegen generate   (veya: make xcode)
name: PlaylistURLExtractor
options:
  bundleIdPrefix: com.salihgencer
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  PlaylistURLExtractorKit:
    path: .
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 4
    DEVELOPMENT_TEAM: A6R928V6HS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  PlaylistURLExtractor:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PlaylistURLExtractorKit
        product: PlaylistURLExtractorKit
    settings:
      base:
        PRODUCT_NAME: Playlist URL Extractor
        PRODUCT_MODULE_NAME: PlaylistURLExtractor
        PRODUCT_BUNDLE_IDENTIFIER: com.salihgencer.PlaylistURLExtractor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Playlist URL Extractor
        CFBundleName: Playlist URL Extractor
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Salih Gencer
    entitlements:
      path: App/PlaylistURLExtractor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
schemes:
  PlaylistURLExtractor:
    build:
      targets:
        PlaylistURLExtractor: all
    run:
      config: Debug
    archive:
      config: Release
